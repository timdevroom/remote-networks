services:
  wg-client:
    image: lscr.io/linuxserver/wireguard:latest
    hostname: wg-client
    restart: unless-stopped
    ports:
      - 127.0.0.1:1080:1080/tcp
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.conf.all.src_valid_mark: 1
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Amsterdam
    volumes:
      - ./wireguard:/config
      - /lib/modules:/lib/modules:ro

  wg-socks5:
    image: serjs/go-socks5-proxy:latest
    restart: unless-stopped
    network_mode: "service:wg-client"
    depends_on:
      - wg-client
    environment:
      REQUIRE_AUTH: false
      PROXY_USER: username
      PROXY_PASSWORD: password
      PROXY_PORT: 1080


  ts-dell:
    image: tailscale/tailscale:latest
    hostname: ts-dell
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TZ: Europe/Amsterdam
    volumes:
      - ./tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 127.0.0.1:1081:1081/tcp
      - 127.0.0.1:1082:1082/tcp

  ts-socks5:
    image: serjs/go-socks5-proxy:latest
    restart: unless-stopped
    network_mode: "service:ts-dell"
    depends_on:
      - ts-dell
    environment:
      REQUIRE_AUTH: false
      PROXY_USER: username
      PROXY_PASSWORD: password
      PROXY_PORT: 1081

  rpi1-socks5:
    image: gogost/gost:latest
    restart: unless-stopped
    network_mode: "service:ts-dell"
    depends_on:
      - ts-dell
    # chains: local :1082 → rpi1 SOCKS5 via Tailscale
    command: -L=socks5://:1082 -F=socks5://rpi1:1080