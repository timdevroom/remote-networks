services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: ts-rpi1
    hostname: ts-rpi1
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./tailscale:/var/lib/tailscale
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: >-
        --advertise-routes=192.168.0.0/24
        --advertise-exit-node
      TZ: Europe/Amsterdam

  socks5:
    image: serjs/go-socks5-proxy:latest
    restart: unless-stopped
    network_mode: host
    environment:
      REQUIRE_AUTH: false
      PROXY_USER: username
      PROXY_PASSWORD: password
      PROXY_PORT: 1080
